name: cbl-api-gateway
services:

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    ports: ["6379:6379"]
    networks: [cbl-net]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
  api-gateway:
    profiles: ["app"]
    build:
      context: ..
    environment:
      HTTP_ADDR: ":8000"
      METRICS_ADDR: ":9200"
      REDIS_ADDR: redis:6379
    ports:
      - "8000:8000"
      - "9200:9200"
    depends_on:
      redis: { condition: service_healthy }
    networks: [cbl-net]

volumes:
  redis-data:

networks:
  cbl-net:
    driver: bridge
